name: release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download Strawberry Perl
      run: |
        Invoke-WebRequest -Uri "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/sp5.34.3.1/strawberry-perl-5.34.3.1-64bit-portable.zip" -OutFile "perl.zip"
        Expand-Archive -Path "perl.zip" -DestinationPath "perl" -Force
    - name: Download NASM
      run: |
        Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip" -OutFile "nasm.zip"
        Expand-Archive -Path "nasm.zip" -DestinationPath "." -Force
        Rename-Item -Path "nasm-3.02" -NewName "nasm"
    - name: Download OpenSSL source code
      run: |
        Invoke-WebRequest -Uri "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz" -OutFile "openssl.tar.gz"
        tar xf openssl.tar.gz
        Rename-Item -Path "openssl-1.1.1w" -NewName "openssl"
    - name: Build OpenSSL
      working-directory: openssl
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        for /f "delims=" %%i in ('"%VSWHERE%" -latest -products * -property installationPath') do set VSPATH=%%i
        call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
        where nmake
        set "PATH=%CD%\..\nasm;%CD%\..\perl\perl\bin;%PATH%"
        perl Configure VC-WIN64A --release ^
              no-afalgeng no-async no-autoalginit no-autoerrinit no-autoload-config ^
              no-capieng no-cms no-comp no-ct no-deprecated no-dgram no-dso no-dynamic-engine ^
              no-ec2m no-engine no-err no-filenames no-gost no-hw-padlock no-makedepend ^
              no-nextprotoneg no-ocsp no-posix-io no-psk no-rfc3779 no-sock no-srp no-srtp no-tests no-threads ^
              no-cmac no-dh no-dsa no-ocb no-poly1305 no-scrypt no-siphash enable-rc5
        nmake
    - name: Build CryptoTool
      run: |
        cmake -B build -S . -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"
        cmake --build build --config Release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: CryptoTool.zip
        path: build\Release\CryptoTool.exe
        archive: true
